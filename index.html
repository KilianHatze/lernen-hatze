<!DOCTYPE html>
<html lang="de">
<head>
  <!-- Wird von `flutter build web --base-href` ersetzt (z. B. /lernen-hatze/ bei GitHub Pages). -->
  <base href="/lernen-hatze/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lernen Hatze – Lernübersichten, Formelsammlung und Prüfungstrainer für Fachinformatiker Systemintegration.">
  <meta name="theme-color" content="#1D5C63">
  <!-- Nur für Leute mit Link gedacht: nicht in Suchmaschinen aufnehmen. -->
  <meta name="robots" content="noindex, nofollow">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lernen Hatze">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lernen Hatze</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #f4fafa; }
    @media (prefers-color-scheme: dark) { html, body { background: #0e1415; } #splash p { color: #b9cacb; } }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: system-ui, "Segoe UI", sans-serif; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash p { margin-top: 18px; color: #3f4949; font-size: 15px; }
    #splash .bar { width: 160px; height: 4px; border-radius: 2px; background: #c8dfe0; overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #1D5C63;
      animation: lade 1.1s ease-in-out infinite; }
    @keyframes lade { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <p>Lernen Hatze wird geladen …</p>
    <div class="bar"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
